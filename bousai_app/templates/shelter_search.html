{% extends "base.html" %}

{% block content %}
<style>
  .shelter-search-form { display: grid; gap: 14px; max-width: 560px; margin: 22px 0; }
  .shelter-search-form label { font-weight: 650; }
  .shelter-search-form input {
    width: 100%;
    min-height: 44px;
    padding: 9px 11px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    color: #334155;
    background: #fff;
    font: inherit;
  }
  .search-button {
    display: inline-flex;
    min-height: 44px;
    align-items: center;
    justify-content: center;
    padding: 9px 18px;
    border: 0;
    border-radius: 8px;
    color: #fff;
    background: #2857a4;
    font: inherit;
    font-weight: 650;
    text-decoration: none;
    cursor: pointer;
  }
  .search-button:hover,
  .search-button:focus-visible { background: #1e4485; }
</style>

<h2>避難所検索</h2>
<p>登録されている避難所を確認できます。</p>

<form action="/search_results" method="get" class="shelter-search-form">
  <div>
    <label for="district">地区名</label>
    <input
      type="text"
      id="district"
      name="district"
      value="{{ district }}"
      placeholder="地区名を入力（空欄で全件表示）"
      autocomplete="address-level3"
    >
  </div>
  <button type="submit" class="search-button">避難所を検索</button>
</form>

<p><a href="/all_shelters">全施設一覧</a></p>
{% endblock %}
