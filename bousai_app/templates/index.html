{% extends "base.html" %}

{% block head %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    .home-content { display: grid; gap: 34px; }

    .home-card {
      padding: 27px;
      border: 1px solid rgb(226 232 240 / 52%);
      border-radius: 19px;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 8px 28px rgb(44 72 110 / 6%);
    }

    .card-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 20px;
      color: #2859a8;
      font-size: 22px;
      font-weight: 750;
      line-height: 1.4;
    }

    .card-heading svg { flex: 0 0 auto; width: 25px; height: 25px; }

    #shelterMap {
      width: 100%;
      height: 365px;
      overflow: hidden;
      border-radius: 12px;
      background: #d4e8ed;
    }

    .weather-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }

    .weather-heading .card-heading { margin: 0; }

    .refresh-label {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
      color: #229b50;
      font-size: 16px;
      font-weight: 650;
    }

    .refresh-label svg { width: 19px; height: 19px; }

    .weather-panel {
      min-height: 176px;
      padding: 20px;
      border-radius: 12px;
      background: #f6f7f9;
    }

    .weather-location,
    .weather-status,
    .weather-meta,
    .warning-list { display: flex; align-items: center; }

    .weather-location { gap: 9px; margin: 0 0 15px; color: #475569; font-size: 18px; font-weight: 700; }
    .weather-location svg { width: 19px; height: 19px; }

    .weather-status { gap: 9px; margin: 0 0 16px; color: #25994d; font-weight: 700; }
    .weather-status svg { flex: 0 0 auto; width: 19px; height: 19px; }
    .weather-status.has-warnings { color: #b45309; }
    .weather-status.is-error { color: #b42318; }

    .warning-list { flex-wrap: wrap; gap: 8px; margin: -5px 0 15px; padding: 0; list-style: none; }
    .warning-list li { padding: 5px 10px; border-radius: 999px; color: #9a3412; background: #ffedd5; font-size: 14px; font-weight: 650; }

    .weather-meta { display: grid; gap: 10px; color: #718096; font-size: 14px; }
    .weather-meta p { display: flex; align-items: center; gap: 7px; margin: 0; }
    .weather-meta svg { width: 16px; height: 16px; }

    @media (max-width: 600px) {
      .home-content { gap: 18px; }
      .home-card { padding: 18px; border-radius: 15px; }
      .card-heading { margin-bottom: 15px; font-size: 19px; }
      #shelterMap { height: min(68vw, 340px); min-height: 245px; }
      .weather-heading { align-items: flex-start; flex-direction: column; gap: 8px; }
      .refresh-label { font-size: 14px; }
      .weather-panel { padding: 16px; }
      .weather-meta { flex-direction: column; align-items: flex-start; }
    }
  </style>
{% endblock %}

{% block content %}
<div class="home-content">
  <section class="home-card" aria-labelledby="map-heading">
    <h1 class="card-heading" id="map-heading">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" fill="currentColor"/>
        <circle cx="12" cy="10" r="2.6" fill="#fff"/>
      </svg>
      避難所マップ
    </h1>
    <div id="shelterMap" role="region" aria-label="青森市周辺の地図"></div>
  </section>

  <section class="home-card" aria-labelledby="weather-heading">
    <div class="weather-heading">
      <h2 class="card-heading" id="weather-heading">
        <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M10 2.5v2M3.64 5.14l1.42 1.42M1 11.5h2"/>
            <path d="m5.06 16.44-1.42 1.42"/>
          </g>
          <circle cx="10" cy="11.5" r="4.2" fill="currentColor"/>
          <path d="M10.2 22h11.15a4.15 4.15 0 0 0 .5-8.27 6.35 6.35 0 0 0-12.17 1.73A3.3 3.3 0 0 0 10.2 22Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="weatherTitle">青森市 気象警報・注意報</span>
      </h2>
      <span class="refresh-label">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 7v5h-5M4 17v-5h5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5.6 9a7 7 0 0 1 11.7-2L20 9M4 15l2.7 2a7 7 0 0 0 11.7-2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        10分おき自動更新
      </span>
    </div>

    <div class="weather-panel" id="weatherContent" aria-live="polite">
      <p class="weather-location">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M19 10c0 4.5-7 11-7 11S5 14.5 5 10a7 7 0 1 1 14 0Z" fill="currentColor"/>
          <circle cx="12" cy="10" r="2.3" fill="#fff"/>
        </svg>
        <span id="weatherArea">青森市</span>
      </p>
      <p class="weather-status" id="weatherStatus" role="status">気象情報を読み込んでいます...</p>
      <ul class="warning-list" id="warningList" hidden></ul>
      <div class="weather-meta">
        <p>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          データ取得: <span id="lastFetchTime">更新中...</span>
        </p>
        <p>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 3v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          気象庁発表: <span id="reportTime">確認中...</span>
        </p>
      </div>
    </div>
  </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([40.8222, 140.7474], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    const status = document.getElementById('weatherStatus');
    const warningList = document.getElementById('warningList');

    function setWeatherStatus(message, statusClass) {
        status.replaceChildren(document.createTextNode(message));
        status.className = `weather-status ${statusClass || ''}`.trim();
    }

    function updateWeatherContent(data) {
        const areaName = typeof data.area_name === 'string' ? data.area_name : '青森市';
        document.getElementById('weatherTitle').textContent = `${areaName} 気象警報・注意報`;
        document.getElementById('weatherArea').textContent = areaName;
        document.getElementById('lastFetchTime').textContent = data.last_fetch_time || '不明';
        document.getElementById('reportTime').textContent = data.report_time || '不明';
        warningList.replaceChildren();

        if (data.error) {
            warningList.hidden = true;
            setWeatherStatus('気象情報を取得できませんでした', 'is-error');
            return;
        }

        const warnings = Array.isArray(data.warnings) ? data.warnings : [];
        if (warnings.length) {
            warnings.forEach((warning) => {
                const item = document.createElement('li');
                const name = typeof warning.name === 'string' ? warning.name : '警報・注意報';
                const warningStatus = typeof warning.status === 'string' ? warning.status : '';
                item.textContent = warningStatus ? `${name}（${warningStatus}）` : name;
                warningList.append(item);
            });
            warningList.hidden = false;
            setWeatherStatus('警報・注意報が発表されています', 'has-warnings');
            return;
        }

        warningList.hidden = true;
        setWeatherStatus('現在、警報・注意報は発表されていません', '');
    }

    async function updateWeatherWarnings() {
        try {
            const response = await fetch('/api/weather_warnings');
            if (!response.ok) {
                throw new Error(`気象情報APIの応答エラー: ${response.status}`);
            }
            updateWeatherContent(await response.json());
        } catch (error) {
            console.error('気象情報の更新に失敗しました:', error);
            setWeatherStatus('気象情報を取得できませんでした', 'is-error');
        }
    }

    updateWeatherWarnings();
    window.setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
